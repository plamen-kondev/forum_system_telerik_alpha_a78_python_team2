{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
<div class="auth-wrap">
    <h1 class="auth-title">Log in</h1>
    <p class="auth-lede">Welcome back. Your takes are waiting.</p>
    {% if error %}
        <div class="form-error" role="alert">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login" class="auth-form" novalidate>
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username"
                   value="{{ username }}" autocomplete="username" required autofocus>
        </div>
        <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-hot w-100">Log in</button>
    </form>

    <p class="auth-switch">New here? <a href="/register">Create an account</a></p>
</div>
{% endblock %}
